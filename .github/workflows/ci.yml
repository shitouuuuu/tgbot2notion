name: CI Syntax & Lint Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Test Python Compilation & Syntax
      run: |
        python -m py_compile src/main.py src/config.py src/bot/handlers.py src/parsers/extractor.py src/services/notion.py
